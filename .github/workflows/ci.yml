# SPDX-License-Identifier: Apache-2.0
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  c:
    name: c (${{ matrix.preset }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [dev, dev-clang, tsan, release, armhf, armhf-release]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build container
        uses: docker/build-push-action@v7
        with:
          context: docker
          file: docker/build.Dockerfile
          tags: psmsgr-build
          load: true
          cache-from: type=gha,scope=psmsgr-build
          cache-to: type=gha,mode=max,scope=psmsgr-build

      # ThreadSanitizer cannot map its shadow memory with the runner's
      # default ASLR entropy.
      - name: Configure, build, test (and package)
        env:
          PSMSGR_NO_ASLR: ${{ matrix.preset == 'tsan' && '1' || '0' }}
        run: docker/run.sh cmake --workflow --preset ${{ matrix.preset }}

      - name: Upload packages
        if: endsWith(matrix.preset, 'release')
        uses: actions/upload-artifact@v7
        with:
          name: deb-${{ matrix.preset }}
          path: build/${{ matrix.preset }}/*.deb
          if-no-files-found: error

  format:
    name: format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build container
        uses: docker/build-push-action@v7
        with:
          context: docker
          file: docker/build.Dockerfile
          tags: psmsgr-build
          load: true
          cache-from: type=gha,scope=psmsgr-build

      # The container's clang-format is the reference: releases differ.
      - name: clang-format
        run: >-
          docker/run.sh sh -c
          'git ls-files -z "*.c" "*.h" "*.cpp" | xargs -0 clang-format --dry-run --Werror'

  python:
    name: python
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build container
        uses: docker/build-push-action@v7
        with:
          context: docker
          file: docker/build.Dockerfile
          tags: psmsgr-build
          load: true
          cache-from: type=gha,scope=psmsgr-build

      - name: Build the library (release)
        run: docker/run.sh cmake --workflow --preset release

      - name: Wheel, pytest, ruff
        run: docker/run.sh bindings/python/check.sh

  csharp:
    name: csharp
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build container
        uses: docker/build-push-action@v7
        with:
          context: docker
          file: docker/build.Dockerfile
          tags: psmsgr-build
          load: true
          cache-from: type=gha,scope=psmsgr-build

      - name: Build the library (release)
        run: docker/run.sh cmake --workflow --preset release

      - name: Build, xUnit, dotnet format, Native AOT smoke, pack
        run: docker/run.sh bindings/csharp/check.sh

      - name: Upload the NuGet package
        uses: actions/upload-artifact@v7
        with:
          name: nupkg
          path: build/release/csharp/nupkg/*.nupkg
          if-no-files-found: error

  go:
    name: go
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build container
        uses: docker/build-push-action@v7
        with:
          context: docker
          file: docker/build.Dockerfile
          tags: psmsgr-build
          load: true
          cache-from: type=gha,scope=psmsgr-build

      - name: Build the library (release)
        run: docker/run.sh cmake --workflow --preset release

      # Only the library, for the linux/arm run of the Go tests: the c
      # (armhf-release) job runs the C tests.
      - name: Build the library (armhf-release)
        run: docker/run.sh sh -c 'cmake --preset armhf-release && cmake --build --preset armhf-release'

      - name: gofmt, go vet, go test (dynamic, race, static, linux/arm under qemu)
        run: docker/run.sh bindings/go/check.sh

  interop:
    name: interop
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build container
        uses: docker/build-push-action@v7
        with:
          context: docker
          file: docker/build.Dockerfile
          tags: psmsgr-build
          load: true
          cache-from: type=gha,scope=psmsgr-build

      - name: Build the library (release)
        run: docker/run.sh cmake --workflow --preset release

      - name: C, Python and C# (Native AOT) agents, pytest, ruff, dotnet format
        run: docker/run.sh interop/check.sh

      - name: Examples in C, Python and C# (Native AOT), writers x readers, ruff, dotnet format
        run: docker/run.sh examples/check.sh

  # x86 hides memory-ordering bugs, and qemu-user on an x86 host still runs
  # with x86 ordering, so only real AArch64 hardware tests the seqlock on
  # weakly ordered memory. Same Dockerfile, built natively for arm64.
  c-arm64:
    name: c (release, arm64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build container
        uses: docker/build-push-action@v7
        with:
          context: docker
          file: docker/build.Dockerfile
          tags: psmsgr-build
          load: true
          cache-from: type=gha,scope=psmsgr-build-arm64
          cache-to: type=gha,mode=max,scope=psmsgr-build-arm64

      - name: Configure, build, test (and package)
        env:
          PSMSGR_TORTURE_SECONDS: 10
        run: docker/run.sh cmake --workflow --preset release

      # CTest shows a test's output only when it fails. Print the counters
      # of the run above from CTest's log instead of running the torture
      # test (70 s here) again. grep fails the step if the section is gone.
      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: deb-release-arm64
          path: build/release/*.deb
          if-no-files-found: error

      - name: Torture test counters
        run: >-
          sed -n '/ Test: test_torture$/,/^"test_torture" end time/p'
          build/release/Testing/Temporary/LastTest.log | grep .

      - name: Python binding
        run: docker/run.sh bindings/python/check.sh

      - name: C# binding
        run: docker/run.sh bindings/csharp/check.sh

      - name: Go binding
        run: docker/run.sh bindings/go/check.sh

      - name: Interop
        run: docker/run.sh interop/check.sh

      - name: Examples
        run: docker/run.sh examples/check.sh
